<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giocatore - Volleyball Scouting')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
    <h1 th:text="${formAction.contains('update')} ? 'Modifica Giocatore' : 'Scheda Giocatore'">Scheda Giocatore</h1>
    <p class="subtitle">Compila i campi e conferma.</p>

    <div class="card">
        <form th:action="@{${formAction}}" method="post" th:object="${playerForm}" class="stack">

            <!-- Box errori (inclusi errori globali come l'allenatore senza squadra) -->
            <div th:if="${#fields.hasAnyErrors()}" class="alert error">
                <ul style="margin:0;padding-left:18px;">
                    <li th:each="e : ${#fields.allErrors()}" th:text="${e}">errore</li>
                </ul>
            </div>

            <label for="name">Nome</label>
            <input type="text" id="name" th:field="*{name}">

            <label for="surname">Cognome</label>
            <input type="text" id="surname" th:field="*{surname}">

            <label for="username">Nome utente</label>
            <input type="text" id="username" th:field="*{username}" th:readonly="${formAction.contains('update')}">

            <label for="birthdate">Data di nascita</label>
            <input type="date" id="birthdate" th:field="*{birthdate}">

            <label for="number">Numero di maglia</label>
            <input type="number" id="number" th:field="*{number}" min="1" max="99">

            <label for="role">Ruolo</label>
            <select id="role" th:field="*{role}">
                <option value="">-- seleziona --</option>
                <option th:each="r : ${roles}"
                        th:value="${r}"
                        th:text="${r.displayName}">Ruolo</option>
            </select>

            <label for="phone">Telefono</label>
            <input type="text" id="phone" th:field="*{phone}">

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}">

            <div class="form-actions">
                <button class="btn" type="submit">Conferma</button>
                <a class="btn secondary" th:href="@{/players/list}">Annulla</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
